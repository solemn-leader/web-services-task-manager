name: web-services-task-manager
services:
  frontend:
    build: ./frontend
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-8088}:80"
    depends_on:
      backend:
        condition: service_healthy
    networks: [app]
    restart: unless-stopped
  backend:
    build: ./backend
    environment:
      DATABASE_URL: "postgresql://task_app:${POSTGRES_PASSWORD:-local_demo_password}@db:5432/task_manager"
      WEB_SERVICE_URL: "http://web-service:4000"
      PORT: "3000"
    depends_on:
      db:
        condition: service_healthy
      web-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    networks: [app]
    restart: unless-stopped
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: task_manager
      POSTGRES_USER: task_app
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-local_demo_password}"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [app]
    restart: unless-stopped
  web-service:
    build: ./web-service
    environment:
      PORT: "4000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 6
    networks: [app]
    restart: unless-stopped
networks:
  app:
    driver: bridge
volumes:
  postgres_data:
